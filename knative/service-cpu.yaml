apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dnn-resnet18-cpu
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: "1"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "4"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - name: user-container
          image: local.registry/serverless-dnn-resnet18:cpu-v1
          imagePullPolicy: Never
          env:
            - name: DEVICE
              value: cpu
          ports:
            - name: http1
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
